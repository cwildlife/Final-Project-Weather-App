<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Henny+Penny&display=swap"
        rel="stylesheet">

    <title>My Weather App</title>
</head>

<body>
    <div id="app-container">

        <header>

            <form id="search-form">

                <input type="search" id="city-input" placeholder="Enter a city name..." required />
                <input type="submit" id="city-search-button" value="Search" />
            </form>

            <div>
                <span id="date-time"></span>
            </div>

        </header>

        <main>

            <div id="main-city">
                <h1 class="city-name" id="city-name"> Dronten </h1>
            </div>
            <div class="emoji-temp-unit-container">
                <span class="emoji" id="emoji" class="emoji">

                </span>
                <span class="temperature-value" id="temperature-value"></span>
                <span class="unit" id="unit">℃</span>
            </div>

            <div id="conditions-container">
                <span id="conditions-description"></span>
                <span class="humidity-wind-data">
                    <br />
                    Humidity: <strong id="humidity"></strong>
                    <br />
                    Wind: <strong id="wind-speed"></strong>
                </span>
            </div>

            <div class="weather-forecast" id="forecast"></div>

        </main>

        <footer>
            <p>
                This project was coded by
                <a href="https://github.com/cwildlife" target="_blank">Celeste Rust</a> and is
                <a href="#" target="_blank"> on GitHub</a> and
                <a href="#" target="_blank">hosted on Vercel</a>
            </p>
        </footer>

        <script src="src/script.js"></script>
    </div>
</body>

</html>
